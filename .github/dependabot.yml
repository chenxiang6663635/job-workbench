# 依赖更新：由 GitHub 开 PR，仍走与人工改动同一条 CI 流水线。
#
# 为什么是 monthly 而不是 weekly：单人维护，噪声即成本（见 CONTRIBUTING
# 「可持续性约定」）。月频 + 分组，把「一堆小 PR」压成每生态每月一个。
#
# dependabot 的 PR 标题是英文（`Bump x from a to b`），会被 pr-title 闸拦下。
# 这是**预期**而不是故障：PR 标题 squash 后就是主干上的 subject，仓库要求中文。
# 处理方式：人审完依赖差异后改标题再合——
#   gh pr edit <编号> --title "chore(deps): 升级 <包> 到 <版本>"
# 不给 dependabot 开豁免：那等于让依赖更新绕过唯一一道 subject 语言闸。
#
# 2026-09-13 首轮实操后的两条收紧（依据：#66 装不上、#68 冲突）：
#
# 1) **分组只收 minor / patch**。`update-types` 交给 groups 后，major 不再被塞进
#    分组里一起撞——它们会各自成 PR，逐个决策。实证：#68 把 typescript 提到 7.0.2
#    （major），而 typescript-eslint 的 peer 是 `>=4.8.4 <6.1.0`，整个分组一起红，
#    既看不出是哪一条的问题、也不方便只放行其中几条。
#
# 2) **pip 的 major 忽略段已于 2026-09-14 删除**——它的到期条件写在自己原来的注释里
#    （「当 ci.yml 的 python-version 不再是 3.8 时删除」）。基线升到 3.12 之后，
#    「新 major 装不上」的原因（3.8 已 EOL、生态撤出；实证 #66 的 pypdf 6.x 要求
#    >=3.9）随之消失，pip 的 major 回到「各自成 PR、逐个决策」的默认轨道。
#    **保留一条容易搞错的机制**：dependabot.yml 的 ignore 只管**版本更新**提案，
#    与**安全更新**无关（安全更新按告警独立触发，不存在「被 ignore 掉的安全修复」）；
#    要收窄安全更新的范围得用 auto-triage 规则，不是这里。
#    另：npm 侧**不**忽略 major，理由是 **major 升级需要人工决策**（Electron 属于
#    平台级破坏性变更，必须排批次 + 桌面实机冒烟，见
#    docs/research/report_electron_33_to_44.md）——不是为了安全更新。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci

  - package-ecosystem: pip
    directory: /web/backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      backend-python:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: build

  - package-ecosystem: npm
    directory: /web/frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      frontend-npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: build

  - package-ecosystem: npm
    directory: /web/electron
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      electron-npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: build
