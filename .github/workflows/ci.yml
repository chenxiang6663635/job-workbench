name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一 PR 的新提交让上一次运行作废：CI 里最贵的 job（Windows exe 构建）要好几分钟，
# 排队等着跑一份已被替换的 diff 没有意义（release 那条刻意不取消——发版不能半途而废）。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端测试（pytest）
    runs-on: ubuntu-latest
    # 没有 timeout 的 job 在卡住时会一直占着队列而不报错（runner 抽风、`pip` 挂起
    # 都会表现为无限等待）。上限给得比实测宽松，是为了让它只在真的卡死时才动手。
    timeout-minutes: 30
    steps:
      # fetch-depth: 0 —— 隐私护栏的 CI 闸要拿 `git diff <base>...HEAD`，而 checkout
      # 默认是浅克隆（depth=1）：base 对象不在本地，diff 直接退出 128（2026-09-23
      # 批末独立审查发现"这道闸在 PR 上必然红"）。只有这一个 job 需要完整历史，
      # 其余 job 保持默认浅克隆。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: 安装 Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r web/backend/requirements-dev.txt

      # 领域包（2026-09-19 补）：领域层 2026-09-17 已包化（import 名 `jobws_core`），
      # 新代码按纪律用**新名**。主 pytest 此前**不装**它——既有模块之所能跑，是因为
      # 它们仍走旧名 shim（`tools/workspace_io.py` 会退化到仓库内源码），而新名没有
      # 这条退路：`tools/jobws.py` → `approval` → `prep_notes` → `jobws_core` 直接
      # ModuleNotFoundError（本地 venv 装了包，掩盖了这条，CI 首跑才暴露）。与
      # mcp / exe 两个 job 同款装上，主矩阵覆盖的就是真装形态。
      - name: 安装领域包
        run: pip install ./packages/jobws-core

      - name: 运行测试
        run: python -m pytest tests/ -q

      # 技能合规与重名校验：与 tools/install_skills.py **共用同一个实现**。
      # 不合规或重名的技能装到宿主侧只有两种下场（被跳过 / 被静默覆盖），
      # 两种都不报错，所以必须在 CI 这一头拦住。
      - name: 校验 skills（合规 + 无重名）
        run: python tools/jobws.py skills check

      # 四端一致性：矩阵、实现、说明页、错误码对照与宿主专属字段。此前只在本地跑，
      # 于是「矩阵登记了但没实现 / 实现了但没登记 / docs/four-ends.md 忘记再生」
      # 这类漂移要等到有人本地跑才被发现。干净检出里镜像目录不存在，镜像那一项
      # 自动跳过（属已知边界，兜底靠开发者本机）。
      - name: 校验四端一致性
        run: python tools/jobws.py lint four-ends

      # 界面文案的硬编码检查：i18n 抽完之后，这一条没有别的机制能拦——新增页面
      # 一个字没翻译，lint 与 tsc 都是绿的，只有英文用户点进去才会发现。
      # 与 pytest 共用同一实现（tools/check_i18n_hardcode.py），口径只有一处。
      - name: 校验界面硬编码中文
        run: python tools/jobws.py lint i18n

      # 界面 token 一致性：旧调色板类名写回来时 Tailwind 不报错（样式只是静默
      # 失效），tsc 与 eslint 也看不见类名字符串——只有这条扫描能拦。
      # 与 check_i18n_hardcode.py 同一种范式：判定唯一实现，CI 与 pytest 共用。
      - name: 校验界面 token 一致性
        run: python tools/jobws.py lint ui-tokens

      # 领域插件合规：「新增领域不改代码」是架构承诺，但语法错、缺文件、词典
      # 分层缺失都不会让任何现有测试变红——只有这条校验能拦住（契约见
      # docs/domain-contract.md，本地同一命令）。
      - name: 校验领域插件（结构 + 词典可解析）
        run: python tools/jobws.py lint domains

      # 主题门禁（批 4）：多主题最容易「某套主题某处看不清」——parity（变量齐全）、
      # 对比度（正文 4.5:1 / 大字与图形 3:1）、暗色明度阶梯（相邻表面 ≥1.12）。
      # 判定唯一实现在 tools/check_themes.py，本地同一命令。
      - name: 校验主题门禁（完整性 / 对比度 / 明度阶梯）
        run: python tools/jobws.py lint themes

      # 规模预算（2026-09-16 治理批）：CONTRIBUTING 的「文件 ≤300 / 函数 ≤80」
      # 此前只有软条款、没有量具（实测 26 个文件超标、16 个函数超 80 行而无人拦）。
      # 存量登记在 tools/size_allowlist.txt（只许变小），这里拦的是**增量**。
      # 判定唯一实现在 tools/check_size.py，本地同一命令。
      - name: 校验规模预算
        run: python tools/jobws.py lint size

      # 隐私护栏（第二道闸，2026-09-23 审计 P2）：本地 pre-commit 的 `--no-verify`
      # 是有意保留的逃生口，但它会连带跳过这一项。CI 拿的是 PR 的完整 diff，
      # 与本地共用同一份判定（`.githooks/pre_commit.py` 的 privacy_problem）。
      - name: 隐私护栏（personal/ 与真实联系方式）
        env:
          JOBWS_PRIVACY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python .githooks/pre_commit.py --privacy-ci

      # 旧名 import 存量（2026-09-17 批 6）：领域层包化后旧路径保留为转发 shim，
      # 这条闸门把旧名 import 点数记成**只许下降**的水位。不跑它就等于没有——
      # 谁随手新增一处 `import filelock`，水位上涨无人拦，shim 就永远删不掉。
      - name: 校验旧名 import 存量（只许下降）
        run: python tools/jobws.py lint legacy-imports

  # 基线升到 3.12 之后不再有第二个版本可跑，原先「3.8 + 3.12 双 job」的支持矩阵
  # 收敛成单 job。**那条教训留在注释里**：matrix 会给 job 显示名加 "(3.12)" 这类
  # 后缀，而「后端测试（pytest）」是分支保护的必需检查——名字一变，main 上的 PR
  # 会全部卡在 Expected（2026-09-13 实测）。将来若要再验一个新解释器（如 3.13），
  # 另开独立 job，别动这个名字，也别用 matrix。
  mcp:
    name: MCP 包（3.12）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 安装 Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      # 与主干 job 分开跑的理由是**职责分层**（MCP 是宿主里的可选组件、主干是
      # 应用本体，发版节奏与依赖面不同），不是依赖约束冲突——历史上「主干把
      # pydantic 钉在 <2.10 与 MCP SDK 的 >=2.12 互斥」那个前提已随 3.12 基线
      # 消失（主干上界放宽到 <2.14，交集 >=2.12,<2.14 且实测同环境全过，见
      # mcp/pyproject.toml 的说明段）。job 名刻意不动（是分支保护的必需检查）。
      # 领域包**必须先装**（2026-09-19 PR-B）：`mcp/pyproject.toml` 现在把 `jobws-core`
      # 写进了 dependencies（领域层全部搬完，MCP 不再需要仓库在侧），而它**不在 PyPI**
      # ——先装 MCP 会让 pip 去 PyPI 找领域包并失败。
      - name: 安装领域包
        run: pip install ./packages/jobws-core

      - name: 安装 MCP 包
        run: pip install -e "./mcp[dev]"

      - name: 运行 MCP 测试
        run: python -m pytest mcp/tests -q

  frontend:
    name: 前端构建（lint + tsc + vite）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 安装 Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: 安装依赖
        working-directory: web/frontend
        run: npm ci

      # tsconfig 的 noUnusedLocals 是关的，未使用的 import/变量不会被 build 抓到。
      # 2026-09-10 的独立审查发现 6 处这类死代码（batch B 遗留）已在仓库里通过 CI，
      # 故把 eslint 加进门槛：warnings 不拦，errors 必拦。
      - name: Lint
        working-directory: web/frontend
        run: npm run lint

      # 前端单元测试（2026-09-16 治理批）：仓库原有的 679 条 pytest 全在后端，
      # 前端长期 0 单测、只有 50 条 Playwright e2e——像「类名冲突谁覆盖谁」这种
      # 一行逻辑只能靠肉眼。先守住纯逻辑这条最小面：不引 jsdom，不替代 e2e。
      - name: 单元测试（Vitest）
        working-directory: web/frontend
        run: npm run test:unit

      # Electron 主进程是零测试覆盖区（桌面端没有 E2E），能纯函数化的部分
      # 就靠这两条兜住：① 缩放上下限与按键映射（zoom.js）零依赖单测；
      # ② 打包白名单守卫——新增模块忘了加进 build.files 时，源码形态照跑、
      # 安装版启动即崩，只有这条检查能在合并前发现。
      - name: Electron 主进程自检（缩放逻辑 + 打包白名单 + URL 守卫）
        # url_guard.test.js 是 P0-2（导航 origin 严格比对 / 外链 scheme 白名单）的
        # 回归网——批末审查发现它当时只在有人手工 `node` 时才跑（测试文件里却写着
        # "CI 也跑这一步"）。护栏没进 CI 等于没有护栏。
        run: |
          node web/electron/zoom.test.js
          node web/electron/window_state.test.js
          node web/electron/reminders.test.js
          node web/electron/diagnostics.test.js
          node web/electron/check_packaging.js
          node web/electron/url_guard.test.js

      - name: 构建
        working-directory: web/frontend
        run: npm run build

  # 最小 UI 冒烟：钉住静态检查测不到的那一类问题（英文标签挤爆顶栏、横向溢出、
  # 控制台报错、serious/critical 可访问性）。**不是**全量 E2E——业务流仍靠发布前的
  # 人工冒烟，这里只跑七个页面 × 三个视口的最小断言集（约 1.5 分钟，2026-09-25 拆级）。
  #
  # 拆级背景：e2e 用例逐批长到 115 条后，PR 上跑全量让每次反馈多等 2 分钟——
  # 全量改在 push main 后跑（下面的 e2e-full job，不阻塞 PR、合并后即回归）。
  ui-smoke:
    name: UI 冒烟（布局 + a11y）
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 安装 Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装后端依赖
        run: pip install -r web/backend/requirements-dev.txt

      # 同上（2026-09-19 补）：初始化 demo 工作区走 `tools/jobws.py`，import 链同样
      # 需要领域包可用（`jobws_core`）。
      - name: 安装领域包
        run: pip install ./packages/jobws-core

      # 后端同源托管 web/frontend/dist，冒烟跑的就是它；demo 工作区提供满数据页面
      - name: 初始化 demo 工作区
        run: python tools/jobws.py init --target demo --demo

      - name: 安装 Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: 安装前端依赖
        working-directory: web/frontend
        run: npm ci

      - name: 构建前端
        working-directory: web/frontend
        run: npm run build

      # 浏览器缓存（2026-09-25 加）：`--with-deps` 的 apt 部分每次都要跑（有系统依赖），
      # 但浏览器二进制（~170MB）缓存后省一次下载。键挂 package-lock（Playwright
      # 版本在其中），锁文件变化即失效重建。
      - name: 缓存 Playwright 浏览器
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/frontend/package-lock.json') }}

      - name: 安装 Playwright 浏览器
        working-directory: web/frontend
        run: npx playwright install --with-deps chromium

      - name: 布局 + a11y 冒烟
        working-directory: web/frontend
        run: npm run test:ui:smoke

  # 全量 E2E（115 条）：2026-09-25 从 ui-smoke 拆出。它的价值形态是「合并后的完整
  # 回归」——push main 后跑，不阻塞任何 PR；PR 上的布局 + a11y 门禁由 ui-smoke 的最小集
  # 守住。发布前的最终防线仍是真机人工冒烟（docs/release-checklist.md）。
  e2e-full:
    name: E2E 全量（main push）
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 安装 Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装后端依赖
        run: pip install -r web/backend/requirements-dev.txt

      - name: 安装领域包
        run: pip install ./packages/jobws-core

      - name: 初始化 demo 工作区
        run: python tools/jobws.py init --target demo --demo

      - name: 安装 Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: 安装前端依赖
        working-directory: web/frontend
        run: npm ci

      - name: 构建前端
        working-directory: web/frontend
        run: npm run build

      - name: 缓存 Playwright 浏览器
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/frontend/package-lock.json') }}

      - name: 安装 Playwright 浏览器
        working-directory: web/frontend
        run: npx playwright install --with-deps chromium

      - name: 全量 E2E
        working-directory: web/frontend
        run: npm run test:ui

  # 领域包的**独立安装冒烟**（2026-09-17 批 6）：主 pytest 跑的是源码树，永远测不到
  # 「装上之后能不能用」——packages 配置、package-data、entry points、依赖声明、
  # 元数据这几类错误只有真装一遍才暴露（setuptools 官方也强调 editable 不是常规
  # 安装的完美替代）。所以这里刻意与主矩阵互补，只管**打包正确性**。
  # 四道闸防「editable 假绿」：不 `-e`、不设 PYTHONPATH、不设 JOBWS_REPO_ROOT、
  # **在仓库之外的 cwd 运行**（Python 把 cwd 作为 sys.path 首项，仓库内运行会
  # 命中源码树，冒烟就白跑了）。
  install-smoke:
    name: 领域包独立安装冒烟
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 安装 Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: 构建 wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist packages/jobws-core

      - name: 干净 venv 装 wheel（非 editable）
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/smoke/bin/pip" install --no-index --find-links dist jobws-core

      - name: 断言非 editable（PEP 610/660：editable 会在 dist-info 写 direct_url.json）
        run: |
          "$RUNNER_TEMP/smoke/bin/python" -c "import json, pathlib, importlib.metadata as m; import jobws_core; p = pathlib.Path(m.distribution('jobws-core').locate_file('')); d = p / 'direct_url.json'; assert not (d.exists() and json.loads(d.read_text(encoding='utf-8')).get('dir_info', {}).get('editable')), '装成了 editable！'; assert 'site-packages' in jobws_core.__file__, jobws_core.__file__; print('非 editable 安装确认：', jobws_core.__file__)"

      # cwd 在仓库之外：仓库内跑会命中源码树，冒烟就失去意义
      - name: 仓库外运行的最小冒烟（子模块 + 真干活 + 版本三向一致）
        working-directory: ${{ runner.temp }}
        run: |
          # 先注入应用根：领域层 `tracker._core` 的 `ROOT` 在**导入期**求值，而下面的
          # walk_packages 会 import 全部子模块——少了这一手，它会在「无人注入」的状态下
          # 抛 RuntimeError（包本身装得对，只是没有入口告诉它根在哪）。
          # 见 `packages/jobws-core/src/jobws_core/pathres.py` 的 `_APP_ROOT` 注释。
          "$RUNNER_TEMP/smoke/bin/python" -c "import importlib, importlib.metadata, json, pathlib, tempfile, pkgutil; from jobws_core import pathres; pathres.set_app_root(tempfile.mkdtemp()); import jobws_core; [importlib.import_module(x.name) for x in pkgutil.walk_packages(jobws_core.__path__, 'jobws_core.')]; from jobws_core import workspace_io; ws = tempfile.mkdtemp(); t = pathlib.Path(ws) / 'hello.txt'; workspace_io.atomic_write_text(str(t), 'OK'); assert t.read_text(encoding='utf-8') == 'OK'; root = pathlib.Path('${{ github.workspace }}'); pv = json.loads((root / 'web/electron/package.json').read_text(encoding='utf-8'))['version']; assert jobws_core.__version__ != '0.0.0.dev0', '元数据被剥离（copy_metadata 没生效）'; assert jobws_core.__version__ == importlib.metadata.version('jobws-core') == pv, (jobws_core.__version__, importlib.metadata.version('jobws-core'), pv); print('冒烟通过，版本：', pv)"

  # 后端 exe 冒烟（2026-09-17 批 6）：这是**唯一**能抓到「领域层没进包」的检查。
  # `web/backend/pyinstaller.spec` 自己写着「CI 只构建不运行产物、会全绿，这正是
  # v0.2.2 imaplib 事故的同款形态」——本 job 就是为这个缺口补的：真的拉起 exe，
  # 请求 /api/system/check（后端在其中实际执行 tracker.run_check，领域层缺席会
  # 立刻 ModuleNotFoundError）。跑 windows-latest：桌面产物就是 Windows exe，
  # 且与 scripts/smoke_backend_exe.py 的写法一致。
  exe-smoke:
    name: 后端 exe 冒烟
    runs-on: windows-latest
    # Windows 上装依赖 + 打 PyInstaller 包最慢，上限放宽到 60 分钟
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 安装 Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装 Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: 安装后端依赖与 PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r web/backend/requirements.txt -r web/backend/requirements-dev.txt "pyinstaller<7"

      - name: 安装领域包（非 editable）
        run: pip install ./packages/jobws-core

      - name: 构建前端
        working-directory: web/frontend
        run: |
          npm ci
          npm run build

      - name: 构建后端 exe
        run: powershell -ExecutionPolicy Bypass -File scripts/build_backend_exe.ps1 -Py "python"

      - name: 运行 exe 冒烟（真跑领域层代码）
        run: python scripts/smoke_backend_exe.py
