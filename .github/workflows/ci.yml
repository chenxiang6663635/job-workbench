name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: 后端测试（pytest）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Python 3.8
        uses: actions/setup-python@v6
        with:
          python-version: "3.8"
          cache: pip

      - name: 安装依赖
        run: pip install -r web/backend/requirements-dev.txt

      - name: 运行测试
        run: python -m pytest tests/ -q

      # 技能合规与重名校验：与 tools/install_skills.py **共用同一个实现**。
      # 不合规或重名的技能装到宿主侧只有两种下场（被跳过 / 被静默覆盖），
      # 两种都不报错，所以必须在 CI 这一头拦住。
      - name: 校验 skills（合规 + 无重名）
        run: python tools/check_skills.py

  frontend:
    name: 前端构建（lint + tsc + vite）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Node 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: 安装依赖
        working-directory: web/frontend
        run: npm ci

      # tsconfig 的 noUnusedLocals 是关的，未使用的 import/变量不会被 build 抓到。
      # 2026-09-10 的独立审查发现 6 处这类死代码（batch B 遗留）已在仓库里通过 CI，
      # 故把 eslint 加进门槛：warnings 不拦，errors 必拦。
      - name: Lint
        working-directory: web/frontend
        run: npm run lint

      - name: 构建
        working-directory: web/frontend
        run: npm run build
