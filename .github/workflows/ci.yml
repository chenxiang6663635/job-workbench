name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: 后端测试（pytest）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          cache: pip

      - name: 安装依赖
        run: pip install -r web/backend/requirements-dev.txt

      - name: 运行测试
        run: python -m pytest tests/ -q

  frontend:
    name: 前端构建（lint + tsc + vite）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: 安装依赖
        working-directory: web/frontend
        run: npm ci

      # tsconfig 的 noUnusedLocals 是关的，未使用的 import/变量不会被 build 抓到。
      # 2026-09-10 的独立审查发现 6 处这类死代码（batch B 遗留）已在仓库里通过 CI，
      # 故把 eslint 加进门槛：warnings 不拦，errors 必拦。
      - name: Lint
        working-directory: web/frontend
        run: npm run lint

      - name: 构建
        working-directory: web/frontend
        run: npm run build

  pr-title:
    name: PR 标题（Conventional + 中文）
    # 只在 PR 上跑：push 到 main 时没有 PR 标题可查
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 本地 pre-commit / commit-msg 只在开发者自己敲 git commit 时运行，
      # 而 squash 合并的提交 subject 是服务器用 PR 标题生成的——本地钩子结构性
      # 地看不到它。2026-09-10 实证：两条英文 PR 标题以 53e7b04 / b774cce 落进
      # main，夹在中文提交之间。这一刀只能由 CI 补。
      # 标题走环境变量而非插进 run：PR 标题是外部可控输入，拼进 shell 等于开后门。
      - name: 校验 PR 标题
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python tools/check_pr_title.py
