name: CodeQL

on:
  push:
    branches: [main]
    # 纯文档 / 站点文案改动不触发：没有可分析代码，白跑几分钟没有意义。
    # paths-ignore 必须在 on.<event> **内部**——放在 workflow 顶层是无效键，
    # 整个 run 会挂在 schema 校验上（2026-10-12 首跑实证：run 失败且零 job）。
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  schedule:
    # 每周一次全量：security 查询套件随 CodeQL bundle 更新——新规则命中旧代码只有
    # 定时跑才能发现，PR 触发只覆盖「这次改动碰到的那几行」。
    - cron: "0 4 * * 1"
  workflow_dispatch:

# 与 ci.yml 同款：同一 ref 的新推送作废上一次运行（CodeQL 单次要好几分钟，
# 排队跑一份已被替换的 diff 没有意义）。
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL 分析（python + javascript）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # security-events: write 是上传扫描结果的最小权限（#207 依赖审计只读锁文件，
      # 本 job 要写 code scanning）；actions: read 供 analyze 读运行上下文。
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # fetch-depth: 0 —— pull_request 事件下 analyze 需要**基提交**在本地，
          # 才能界定「哪些告警落在本次改动的行上」；默认浅克隆（depth=1）缺基对象，
          # 正是 codeql-action 的已知失败模式。与 ci.yml backend job 同款先例
          # （那处注释记着「只有这一个 job 需要完整历史」——本 job 落地后已过时，
          #  同批改为两个 job）。
          fetch-depth: 0

      # codeql-action v3.38.3（2026-10-08；同日还有 v4.38.3，两者发布内容一致，
      # v3 是长期稳定主线——升 v4 属独立评估项，dependabot 会提 PR，届时按变更说明逐条核）。
      # **时限**：run 日志已明示「CodeQL Action v3 will be deprecated in December
      # 2026」——26.11.0（十一月发车）落地后不久就会撞上弃用窗口，v4 升级评估是
      # 发布链前置项之一（dependabot 月度 PR 会提：变更说明逐条核 + PR 实测），
      # 别等弃用当天再动。
      # 版本策略与仓库其他 action 一致：按提交 SHA 固定 + 行尾注释版本号。
      - name: 初始化 CodeQL
        uses: github/codeql-action/init@9f759ee644a3e7c15c1390abf49868036c00067b # v3.38.3
        with:
          # 语言按仓库实际代码面取（#207 登记的 follow-up 原文即「Python + JS/TS」）：
          # python = tools/ packages/ mcp/ web/backend/ scripts/ site/；
          # javascript = web/frontend/ web/electron/ site/（TS/TSX 由 js 提取器覆盖）。
          languages: python, javascript
          # 查询集**刻意不显式指定**：默认查询集即安全类（GitHub code scanning 的
          # default setup）。首跑实证：`queries: security` 会被 bundle 2.27.2 当作
          # **查询包名**解析并 fatal（"Query pack security cannot be found"）——三个
          # 内置套件名并不是可移植的 CLI 输入。将来要收紧（security-extended）或放宽时，
          # 走 config-file 的 queries 字段或 init 输入，并先在 PR 上实测。
          # 分析范围与排除项见 .github/codeql/codeql-config.yml
          config-file: ./.github/codeql/codeql-config.yml

      # 刻意不装依赖、不构建：python 与 javascript（build-mode 默认 none）都是
      # 源码级提取——本机那套 venv / npm ci 对分析没有增益，只会让每次扫描多等
      # 两分钟。这不是疏漏，别「修复」它。
      - name: 执行分析并上传
        uses: github/codeql-action/analyze@9f759ee644a3e7c15c1390abf49868036c00067b # v3.38.3
