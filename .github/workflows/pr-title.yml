name: PR 标题

# 单独成一个 workflow 而不是塞进 ci.yml，关键在 types 里的 edited：
# pull_request 默认只触发 opened / synchronize / reopened——**编辑标题不会重跑**，
# 于是「按提示改标题」这个既定修法清不掉红叉（2026-09-10 实测：改完标题后
# 运行列表里仍然只有那一次 failure）。必须显式加 edited。
# 而一旦把 edited 加进 ci.yml，改正文、加标签都会连带重跑 pytest 与前端构建；
# 标题校验只要 6 秒，让它自己按 edited 频繁重跑、重活只在代码变更时跑，更划算。
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

# 只需要读代码，不需要任何写权限
permissions:
  contents: read

# 改标题会触发一次新的运行；上一次的通常还在装依赖，没必要让它跑完
concurrency:
  group: pr-title-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    # 注意：这个 name 会被分支保护当作 required check 的标识。改名的瞬间
    # 旧名字就再也不会被上报，main 上所有 PR 会卡在「Expected — Waiting」而无法合并。
    # 要改就同一天把分支保护里的必需检查一起改。
    name: PR 标题（Conventional + 中文）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # 与后端 job 一致地钉住解释器版本。runner 上确实有 python（这个 job 跑通过），
      # 但「恰好有」不等于「保证有」——闸门不该依赖镜像的隐式行为。
      - name: 安装 Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      # 本地 pre-commit / commit-msg 只在开发者自己敲 git commit 时运行，而
      # squash 合并的提交 subject 是 GitHub 用 PR 标题现场生成的——本地钩子
      # 结构性地看不到它。2026-09-10 实证：两条英文 PR 标题以 53e7b04 /
      # b774cce 落进 main，夹在中文提交之间。这一刀只能由 CI 补。
      # 领域包（2026-09-19 补）：本 job 此前零依赖，但 `tools/jobws.py` 的 import 链
      # 里有 `approval` → `prep_notes` → `jobws_core`——新代码按纪律用新名，不装上
      # 领域包这条链路会在**校验标题之前**就 ModuleNotFoundError（PR #149 首跑暴露）。
      # 装上它（纯 Python 包，约 10 秒）比把 CLI 的 import 改懒更省心：标题校验走的
      # 是与后端同一份判定实现，环境也该与后端同形。
      - name: 安装领域包
        run: pip install ./packages/jobws-core

      # 标题走环境变量而非插进 run：PR 标题是外部可控输入，拼进 shell 等于开后门。
      - name: 校验 PR 标题
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        # 走统一入口 tools/jobws.py（8 个脚本的 CLI 外壳已合并，旧路径只给迁移提示）
        run: python tools/jobws.py lint pr-title
