name: Release

# 打 tag 即产出安装包并挂到该 Release。
#
# 为什么要有这个 workflow（不是"顺手自动化一下"）：
# v0.1.1 的安装包是 batch B/C 之前构建的，之后主干还换过图标——下载页上那份 exe
# 已经不代表当前代码，而且**没有任何机制会发现这件事**。让 tag 触发构建之后，
# 资产与 tag 同源，「安装包与代码脱节」在结构上不再可能发生。
#
# 三道闸都不通过就拒绝发布，且每条都给出可照做的修法：
#   1. tag 与 web/electron/package.json 的版本号必须一致（否则资产名会说谎）
#   2. CHANGELOG.md 里必须有该版本的条目（否则等于发布了没人知道的东西）
#   3. 必须真的产出 .exe（否则不许静默成功）
on:
  push:
    tags:
      - "v*"
  # 手动触发用于演练：dry_run=true 只构建 + 校验 + 存成 workflow artifact，不碰 Release。
  # 这是唯一能在不打 tag 的情况下验证这条链路的方式。
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只构建与校验，不创建 Release"
        type: boolean
        default: true

# 需要写 Release 与上传资产
permissions:
  contents: write

jobs:
  build-windows-installer:
    name: 打包 Windows 安装包并挂 Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 版本号唯一来源是 web/electron/package.json（CONTRIBUTING 的规定）。
      # tag 与它不一致时直接停下：资产名 job-workbench-setup-<ver>-win64.exe 里的 ver
      # 取自 package.json，若两者不同，用户下载到的东西名字与实际版本就对不上。
      - name: 读取版本号并校验 tag 一致
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content web/electron/package.json -Raw -Encoding UTF8 | ConvertFrom-Json).version
          if (-not $version) { throw "读不到 web/electron/package.json 的 version" }
          Write-Host "package.json version = $version"
          "version=$version" >> $env:GITHUB_OUTPUT

          if ($env:GITHUB_REF -like "refs/tags/*") {
            $tag = $env:GITHUB_REF -replace "^refs/tags/", ""
            Write-Host "tag = $tag"
            if ($tag -ne "v$version") {
              throw "tag 与 package.json 版本不一致：tag=$tag，package.json=$version。先 bump 版本号再打 tag。"
            }
          } else {
            Write-Host "手动触发（非 tag），跳过 tag 一致性校验"
          }

      # CHANGELOG 是"使用者可见变更"的唯一台账（CONTRIBUTING 的规定）。缺条目就拒绝发布——
      # 这正是本批次要修的那类漂移：v0.1.1 之后 5 个 feat 一条都没记。
      - name: 校验 CHANGELOG 有该版本条目
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.version.outputs.version }}"
          $lines = Get-Content CHANGELOG.md -Encoding UTF8
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($version))\]" | Select-Object -First 1)
          if (-not $start) {
            throw "CHANGELOG.md 里没有 [$version] 段。把它从 [Unreleased] 落成 [$version] 再打 tag。"
          }

          # 抽出该版本段落作为 Release 说明，避免发布时再手抄一遍
          $rest = $lines[($start.LineNumber - 1)..($lines.Count - 1)]
          $end = ($rest | Select-Object -Skip 1 | Select-String -Pattern "^## \[" | Select-Object -First 1)
          $body = if ($end) { $rest[0..($end.LineNumber - 2)] } else { $rest }
          $body | Set-Content tmp_release_notes.md -Encoding UTF8
          Write-Host "已抽出 $($body.Count) 行作为 Release 说明"

      - name: 安装 Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      # PyInstaller 不在 requirements.txt 里（它只是构建期依赖，不该打给终端用户）。
      # 注意不要在探测清单里加 filelock：它是仓内模块，不是 pip 依赖。
      - name: 安装后端依赖与 PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r web/backend/requirements.txt pyinstaller

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 两个 package-lock.json 都在仓库里，用 npm ci 保证与锁文件一致
      - name: 安装前端与 electron 依赖
        shell: pwsh
        run: |
          npm ci --prefix web/frontend
          npm ci --prefix web/electron

      # 走与本地完全相同的那条链路：build_desktop.ps1 → build_backend_exe.ps1（前端 dist →
      # PyInstaller onedir）→ electron-builder NSIS。显式把解释器传给 -Py，避免脚本内的
      # 探测在这台机器上落到别的 Python。
      # runner 具备管理员权限，历史上本地踩过的 winCodeSign 符号链接解压问题在这里不会出现。
      - name: 构建安装包
        shell: pwsh
        run: |
          $py = (Get-Command python).Source
          Write-Host "使用解释器: $py"
          powershell -ExecutionPolicy Bypass -File scripts/build_desktop.ps1 -Py $py

      - name: 定位并改名产物
        id: artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.version.outputs.version }}"
          $found = Get-ChildItem web/electron/release -Filter *.exe -ErrorAction SilentlyContinue
          if (-not $found) {
            # 不许静默成功：没产物就是失败，并说清去哪找线索
            throw "构建结束但 web/electron/release 下没有 .exe。看上一步输出里 electron-builder 的报错。"
          }
          $found | ForEach-Object { Write-Host ("找到产物: {0}  ({1:N1} MB)" -f $_.Name, ($_.Length / 1MB)) }
          if ($found.Count -gt 1) {
            throw "web/electron/release 下有多个 .exe，无法判断该发布哪个：$($found.Name -join ', ')"
          }

          # Release 资产统一用 ASCII 名（与 v0.1.1 的 job-workbench-setup-0.1.1-win64.exe 一致）：
          # 下载链接、脚本引用都不该依赖中文产品名。
          $asset = "job-workbench-setup-$version-win64.exe"
          Copy-Item $found[0].FullName $asset -Force
          Write-Host "资产名: $asset"
          "asset=$asset" >> $env:GITHUB_OUTPUT

      - name: 演练模式——只存成 workflow artifact
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: installer-dry-run
          path: ${{ steps.artifact.outputs.asset }}
          retention-days: 7

      # 用 gh（runner 预装、第一方）而不是第三方 release action：少一个供应链依赖。
      # --clobber 让同一 tag 可以重跑；Release 已存在时只更新资产与说明，不重复创建。
      - name: 创建或更新 Release 并上传资产
        if: github.event_name == 'push' || !inputs.dry_run
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ github.ref_name }}"
          $asset = "${{ steps.artifact.outputs.asset }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $tag 不存在，创建"
            gh release create $tag --title $tag --notes-file tmp_release_notes.md
          } else {
            Write-Host "Release $tag 已存在，更新说明"
            gh release edit $tag --notes-file tmp_release_notes.md
          }
          gh release upload $tag $asset --clobber
          gh release view $tag --json assets --jq '.assets[] | "\(.name)  \(.size) bytes"'
