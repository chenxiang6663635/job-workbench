name: Site

# 站点（MkDocs Material 文档站）的构建与分发：
#   build   —— 按白名单组装 docs/ 与 site/content/ → `mkdocs build --strict`（坏链/缺页即红）；
#   publish —— 仅 main 的 push：把产物强制推送到 `site-dist` 分支，供 EdgeOne Makers
#              以「监控分支、零构建命令、输出目录 /」直接分发。
#
# 为什么产物要经 artifact 传递、而不是让 publish 自己重新构建（照 release.yml 的权限模型）：
# 构建链要跑 `pip install`（任意依赖的构建钩子都有执行机会），让写权限覆盖这条链等于
# 把可写 token 交给整棵依赖树。所以 build 只拿 `contents: read`；publish 只做
# 「下载产物 + git push」两件事、不装任何依赖，才给它 `contents: write`。
#
# 触发为何不限分支：任何分支的 push 都先跑一次构建（提前发现坏链），发布由 publish
# 的 if 收口到 main；paths 过滤让无关改动不触发。
#
# 注意：**若未来把本 workflow 的检查加入分支保护必需项，需评估去掉 paths 过滤**——
# 否则不触碰 site/、docs/ 与本文件的 PR 会永远停在「Expected/期望中」而无法合并
# （同类教训见 ci.yml 里「后端测试（pytest）」job 的注释：必需检查的名字/触发条件
# 一变，main 上的 PR 就会全部卡在 Expected）。
on:
  pull_request:
    paths:
      - "site/**"
      - "docs/**"
      - ".github/workflows/site.yml"
  push:
    paths:
      - "site/**"
      - "docs/**"
      - ".github/workflows/site.yml"

# 默认最小权限；publish job 单独提权（照 release.yml）。
permissions:
  contents: read

# 同一 ref 的两次运行会抢着推 site-dist（强制推是整体替换，后跑的覆盖先跑的）。
# 取消旧运行，保证最终落地的永远是更新的那次构建。release 的发布链刻意相反
# （cancel-in-progress: false）——站点分支是可重建的派生内容，不受那条约束。
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 站点构建（组装 + --strict）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # 默认会把 GITHUB_TOKEN 写进 .git/config，构建链不需要任何凭证（同 release.yml）。
          persist-credentials: false

      - name: 安装 Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: site/requirements.txt

      # 站点的构建结果只取决于仓库内容与这份 pin（site/requirements.txt 规定：
      # 不允许区间版本）——不随「今天的分辨结果」漂移。
      - name: 安装站点依赖
        run: pip install -r site/requirements.txt

      - name: 组装站点（白名单复制 + 模板注入）
        run: python site/scripts/build_site.py

      # --strict：warning 一律判红（站点验收定义即「严格构建绿」，不做任何
      # validation 降级——站上的坏链对用户就是 404，必须挡在合并之前）。
      - name: MkDocs 严格构建
        run: python -m mkdocs build -f site/mkdocs.yml --strict

      # 产物交给 publish job：写权限不留在构建链（同 release.yml 的 release-payload）。
      - name: 传递产物给发布 job
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: site-payload
          path: site/.build/site/
          retention-days: 3
          if-no-files-found: error

  publish:
    name: 发布站点产物到 site-dist 分支
    needs: build
    # 只有 main 的 push 才发布：PR 与其它分支仅验证构建，不产生站点分支内容。
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3  # v8.0.0
        with:
          name: site-payload
          path: site/.build/site

      # site-dist 是**派生产物分支**（从 site/.build/site 整体重建，不是人类历史）：
      # 每次运行强制推、全量替换——保留旧历史既无意义、又让仓库持续变大。
      # 提交信息里记下源提交 SHA，从站点分支可回溯到代码。
      # EdgeOne Makers 侧约定：监控 site-dist、零构建命令、输出目录 /。
      - name: 推送到 site-dist 分支
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          cd site/.build/site
          # 不许静默成功：产物缺 index.html 时推到 site-dist 等于把线上站点清空。
          if [ ! -f index.html ]; then
            echo "::error::产物里没有 index.html——构建产物可能没传过来，拒绝发布空站点"
            exit 1
          fi
          git init -q
          git add -A
          git commit -q -m "site: 站点产物（源提交 ${GITHUB_SHA}）"
          # token 只经环境变量进入 remote URL，不写进脚本文本（避免出现在日志里）。
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:site-dist
