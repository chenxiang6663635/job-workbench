<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Job Workbench — local-first, AI-assisted job search workspace">
  <!--
    品牌横幅（2026-10-30，Nord 版）。
    配色用标准 Nord 色板（nord0-nord15），与 src/lib/theme.ts 里
    `{ id: "nord", swatch: ["#2e3440", "#3b4252", "#88c0d0"] }` 一致；
    themes/nord.css 的 HSL 变量是它的近似值（#2f3541 / #3c4353 / #87bfcf），
    两者差别在 1-2%，肉眼不可分，这里取标准值。

    nord0  #2E3440  底色      nord3  #4C566A  边框
    nord1  #3B4252  卡片      nord4  #D8DEE9  次要文字
    nord6  #ECEFF4  主文字    nord8  #88C0D0  主色（青蓝）
    nord13 #EBCB8B  辅助（黄） nord14 #A3BE8C  成功（绿）
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e3440"/>
      <stop offset="1" stop-color="#343b49"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#88c0d0"/>
      <stop offset="1" stop-color="#8fbcbb"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#88c0d0"/>
    </marker>
  </defs>

  <rect width="1280" height="360" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="1278" height="358" rx="19" fill="none" stroke="#434c5e" stroke-width="2"/>

  <!-- 左侧：副标题（产品名由 README 的 H1 承担） -->
  <text x="80" y="132" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="40" font-weight="700" fill="#eceff4" letter-spacing="-0.5">local-first</text>
  <text x="80" y="180" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="40" font-weight="700" fill="#88c0d0" letter-spacing="-0.5">AI-assisted</text>
  <text x="80" y="220" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="40" font-weight="700" fill="#eceff4" letter-spacing="-0.5">job search</text>

  <rect x="80" y="240" width="120" height="4" rx="2" fill="url(#accent)"/>

  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#d8dee9">
    <text x="80" y="284">Windows desktop</text>
    <text x="238" y="284">bilingual</text>
    <text x="348" y="284">plain text on your disk</text>
  </g>

  <!--
    右侧：2×2 卡片闭环（顺时针 A→B→D→C→A）。
    卡片实际位置：上排 (590,80)-(703,160) 与 (810,80)-(923,160)
                  下排 (590,200)-(703,280) 与 (810,200)-(923,280)
    箭头只走网格四条边，不越界、不指向空白。
    语义：A 岗位 → B 资格核对 → D 投递追踪 → C 面试与 Offer → 回到 A。
  -->
  <g>
    <path d="M706,120 L803,120" stroke="#88c0d0" stroke-width="2" marker-end="url(#arrow)" opacity="0.6"/>
    <path d="M866,163 L866,196" stroke="#88c0d0" stroke-width="2" marker-end="url(#arrow)" opacity="0.6"/>
    <path d="M803,240 L706,240" stroke="#88c0d0" stroke-width="2" marker-end="url(#arrow)" opacity="0.6"/>
    <path d="M646,196 L646,163" stroke="#88c0d0" stroke-width="2" marker-end="url(#arrow)" opacity="0.6"/>

    <!-- 卡片 A：岗位 -->
    <g>
      <rect x="590" y="80" width="113" height="80" rx="12" fill="#3b4252" stroke="#4c566a" stroke-width="2"/>
      <rect x="606" y="100" width="46" height="7" rx="3.5" fill="#88c0d0"/>
      <rect x="606" y="116" width="70" height="6" rx="3" fill="#4c566a"/>
      <rect x="606" y="130" width="58" height="6" rx="3" fill="#4c566a"/>
    </g>

    <!-- 卡片 B：资格核对 -->
    <g>
      <rect x="810" y="80" width="113" height="80" rx="12" fill="#3b4252" stroke="#4c566a" stroke-width="2"/>
      <circle cx="832" cy="106" r="12" fill="#a3be8c" opacity="0.18"/>
      <path d="M826,106 L830,110 L838,100" stroke="#a3be8c" stroke-width="2.5" fill="none"
            stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="854" y="100" width="50" height="7" rx="3.5" fill="#eceff4"/>
      <rect x="826" y="130" width="76" height="6" rx="3" fill="#4c566a"/>
    </g>

    <!-- 卡片 C：面试与 Offer（下排左） -->
    <g>
      <rect x="590" y="200" width="113" height="80" rx="12" fill="#3b4252" stroke="#4c566a" stroke-width="2"/>
      <circle cx="618" cy="232" r="15" fill="#ebcb8b" opacity="0.18"/>
      <path d="M610,232 L616,238 L627,225" stroke="#ebcb8b" stroke-width="2.5" fill="none"
            stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="644" y="222" width="40" height="7" rx="3.5" fill="#eceff4"/>
      <rect x="606" y="256" width="66" height="6" rx="3" fill="#4c566a"/>
    </g>

    <!-- 卡片 D：投递追踪（下排右） -->
    <g>
      <rect x="810" y="200" width="113" height="80" rx="12" fill="#3b4252" stroke="#4c566a" stroke-width="2"/>
      <rect x="826" y="220" width="16" height="16" rx="4" fill="#88c0d0" opacity="0.35"/>
      <rect x="850" y="222" width="52" height="7" rx="3.5" fill="#eceff4"/>
      <rect x="826" y="248" width="70" height="6" rx="3" fill="#4c566a"/>
    </g>
  </g>

  <!-- 右上角装饰点 -->
  <g fill="#88c0d0" opacity="0.22">
    <circle cx="1204" cy="52" r="5"/>
    <circle cx="1224" cy="52" r="5"/>
    <circle cx="1204" cy="72" r="5"/>
    <circle cx="1224" cy="72" r="5"/>
  </g>
</svg>
