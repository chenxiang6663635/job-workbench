<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Job Workbench — local-first, AI-assisted job search workspace">
  <!--
    品牌横幅（2026-10-30）。
    配色直接取自 web/frontend/src/themes/light.css 的 HSL 变量，换算成 HEX：
      background 220 23% 97% -> #f6f7f9
      foreground 222 47% 11% -> #0f1729
      primary    201 96% 32% -> #0369a0
      warning     26 90% 37% -> #b35309
      border     214 32% 91% -> #e1e7ef
    用产品自己的色板，README 的图和界面放一起才不会像两个产品。
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f7f9"/>
      <stop offset="1" stop-color="#eff2f6"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0369a0"/>
      <stop offset="1" stop-color="#b35309"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#48566a"/>
    </marker>
  </defs>

  <rect width="1280" height="360" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="1278" height="358" rx="19" fill="none" stroke="#e1e7ef" stroke-width="2"/>

  <!-- 左侧：产品名 -->
  <text x="80" y="150" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="54" font-weight="700" fill="#0f1729" letter-spacing="-1">job-workbench</text>
  <text x="80" y="196" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="21" fill="#48566a">local-first · AI-assisted · auditable</text>

  <!-- 左侧：一条 accent 线 -->
  <rect x="80" y="222" width="120" height="4" rx="2" fill="url(#accent)"/>

  <!-- 左侧：三个小字标签 -->
  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#48566a">
    <text x="80" y="268">Windows desktop</text>
    <text x="238" y="268">bilingual</text>
    <text x="348" y="268">plain text on your disk</text>
  </g>

  <!-- 右侧：四张卡片 + 连线，示意「一个闭环」 -->
  <g>
    <!-- 连线 -->
    <path d="M700,120 L760,120" stroke="#48566a" stroke-width="2" marker-end="url(#arrow)" opacity="0.55"/>
    <path d="M920,120 L980,120" stroke="#48566a" stroke-width="2" marker-end="url(#arrow)" opacity="0.55"/>
    <path d="M1140,120 C1180,120 1180,240 1140,240" stroke="#48566a" stroke-width="2"
          fill="none" marker-end="url(#arrow)" opacity="0.55"/>
    <path d="M980,240 L920,240" stroke="#48566a" stroke-width="2" marker-end="url(#arrow)" opacity="0.55"/>
    <path d="M760,240 L700,240" stroke="#48566a" stroke-width="2" marker-end="url(#arrow)" opacity="0.55"/>

    <!-- 上排两张 -->
    <g>
      <rect x="590" y="80" width="110" height="80" rx="12" fill="#ffffff" stroke="#e1e7ef" stroke-width="2"/>
      <rect x="606" y="100" width="46" height="7" rx="3.5" fill="#0369a0"/>
      <rect x="606" y="116" width="70" height="6" rx="3" fill="#e1e7ef"/>
      <rect x="606" y="130" width="58" height="6" rx="3" fill="#e1e7ef"/>
    </g>
    <g>
      <rect x="810" y="80" width="110" height="80" rx="12" fill="#ffffff" stroke="#e1e7ef" stroke-width="2"/>
      <circle cx="832" cy="106" r="12" fill="#eff2f6" stroke="#0369a0" stroke-width="2"/>
      <rect x="854" y="100" width="50" height="7" rx="3.5" fill="#0369a0"/>
      <rect x="826" y="130" width="76" height="6" rx="3" fill="#e1e7ef"/>
    </g>

    <!-- 下排两张 -->
    <g>
      <rect x="590" y="200" width="110" height="80" rx="12" fill="#ffffff" stroke="#e1e7ef" stroke-width="2"/>
      <rect x="606" y="220" width="18" height="18" rx="4" fill="#047756"/>
      <rect x="632" y="222" width="52" height="7" rx="3.5" fill="#0f1729"/>
      <rect x="606" y="250" width="70" height="6" rx="3" fill="#e1e7ef"/>
    </g>
    <g>
      <rect x="810" y="200" width="110" height="80" rx="12" fill="#ffffff" stroke="#e1e7ef" stroke-width="2"/>
      <rect x="826" y="216" width="34" height="34" rx="17" fill="none" stroke="#b35309" stroke-width="3"/>
      <path d="M836,232 L845,241 L860,224" stroke="#b35309" stroke-width="3" fill="none"
            stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="872" y="226" width="32" height="7" rx="3.5" fill="#0f1729"/>
      <rect x="826" y="260" width="66" height="6" rx="3" fill="#e1e7ef"/>
    </g>
  </g>

  <!-- 右上角装饰点 -->
  <g fill="#0369a0" opacity="0.18">
    <circle cx="1216" cy="44" r="5"/>
    <circle cx="1236" cy="44" r="5"/>
    <circle cx="1216" cy="64" r="5"/>
    <circle cx="1236" cy="64" r="5"/>
  </g>
</svg>
