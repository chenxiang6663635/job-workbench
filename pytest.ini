# pytest 的临时目录保留策略。
#
# 为什么写这两行：`tmp_path` 默认落在系统临时目录（`%TEMP%/pytest-of-<user>/`），
# 默认策略是"最近 3 次全留"。本仓库的测试每个都要造一个完整工作区（`--demo` 一次
# 几十个文件），跑几十轮之后单个 run 目录就有上千文件——而 pytest 在**下次运行
# 开始时**会删掉更早的 run，那一删就是上千文件的批量操作，会被本地安全护栏整个
# 拦下（2026-09-14 实测：`pytest-of-<user>` 涨到 **15978** 个文件，随后
# `python -m pytest tests/ -q` 被判为"批量删除 1414 个文件"并拒绝执行）。
#
# retention_policy=failed：只保留**失败**用例的现场——全绿时本次运行结束就清干净
#   （实测跑完 690+ 个用例后残留也极少——留下的主要是失败现场），下次运行没有大批量可删；
# retention_count=1：最多留最近 1 次运行。
#
# 临时目录**仍然留在系统临时目录**（不动 basetemp）：实测把 basetemp 挪进仓库内
# （D 盘、且项目目录被实时防护扫描）会让全量测试从 12 秒涨到 216 秒——修复不该
# 以牺牲速度为代价，而"清理量"这件事策略已经解决了。
[pytest]
tmp_path_retention_count = 1
tmp_path_retention_policy = failed
# shim 的废弃告警（2026-09-17 批 6）：存量 54 个测试文件仍走旧名 import
# （`import filelock` / `import workspace_io`），在迁移完成前它们**必然**发
# DeprecationWarning。不在这里精准忽略，将来一旦有人开 `-W error`（或 pytest
# 改了默认），这 54 个文件会集体变红，逼人去调高告警阈值而不是去改 import——
# 盯这件事的地方是 `jobws lint legacy-imports`（旧名 import 数只许下降），
# 不是告警开关。只忽略这两个模块的告警，其余 DeprecationWarning 照旧可见。
filterwarnings =
    ignore:import filelock 已废弃:DeprecationWarning
    ignore:import workspace_io 已废弃:DeprecationWarning
