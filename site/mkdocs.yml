# 站点配置——构建入口（先组装、再严格构建）：
#   python site/scripts/build_site.py
#   python -m mkdocs build -f site/mkdocs.yml --strict
site_name: 求职工作台

# 均为相对本文件所在目录（site/）的路径；.build/ 已 gitignore，不是版本库内容
docs_dir: .build/docs
site_dir: .build/site

theme:
  name: material
  language: zh
  # 关闭 Material 默认的 Google Fonts（每页 render-blocking 第三方请求；fonts.gstatic.com 在国内不可达）
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - content.code.copy

# nav 五项：下载页（site/content/download.tmpl.md 与 .en 版）的版本号 / 发布日期
# 由 build_site.py 从 web/electron/package.json 与 CHANGELOG.md 注入，不人工维护。
nav:
  - 首页: index.md
  - 使用手册: manual/guide.md
  - 数据与隐私: privacy/index.md
  - 支持与兼容: compat/index.md
  - 下载: download.md

# 跨语言页面互链 → 目标语言站点 URL（i18n suffix 结构下正文互链的坏链修复；
# 见 hooks/i18n_cross_language_links.py 的模块 docstring）
hooks:
  - hooks/i18n_cross_language_links.py

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      languages:
        - locale: zh
          name: 简体中文
          default: true
          # zh 侧同样显式声明：插件在多次构建间会重置语言级 theme 覆盖，zh 不声明
          # 会被 en 的已存值带偏（serve 重建后 zh 外壳漂成英文；一次性构建无此问题）
          theme:
            language: zh
        - locale: en
          name: English
          # 英文站站名本地化（插件支持的语言级覆盖；中文站沿用全局 site_name）
          site_name: Job Workbench
          # 英文站 Material 外壳语言本地化（<html lang> / 搜索等 UI 串；插件支持的语言级
          # theme 覆盖；palette 提示不随语言覆盖）
          theme:
            language: en
          nav_translations:
            首页: Home
            使用手册: Manual
            数据与隐私: Privacy
            支持与兼容: Support & Compatibility
            下载: Download

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.superfences
