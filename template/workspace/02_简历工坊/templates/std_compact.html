<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>求职简历（紧凑版式）</title>
<style>
  /* 紧凑版式（批 4.5）：与 std_resume 共享同一套占位符与区块骨架，
     差异只在**密度**——更小字号、更紧行距、更窄页边距，用于内容多、
     要压进一页的场景。改这段密度变量之外的任何结构前，先看
     tests/test_resume_templates.py 的占位符契约。
     A4 一页：必须显式声明 @page size:A4，否则默认 Letter(612×792)。 */
  @page { size: A4; margin: 9mm 11mm; }
  /* @page 只在打印/导出 PDF 时生效；屏幕预览用 @media screen 补等价留白，
     保证预览换行位置等于 PDF 换行位置（9mm≈34px、11mm≈41px）。 */
  @media screen {
    body { padding: 34px 41px; }
  }
  @media print {
    body { padding: 0; }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "微软雅黑", "SimSun", sans-serif;
    font-size: 8.8pt; line-height: 1.3; color: #1a1a1a;
  }
  /* 简历风格（批 4）：主色收敛为 --resume-accent——换色只改这一个变量；
     简历保持亮底深字的专业取向，不跟随应用主题皮肤。 */
  :root { --resume-accent: #2c5f8d; }
  .header { border-bottom: 2px solid var(--resume-accent); padding-bottom: 4px; margin-bottom: 7px; }
  h1 { font-size: 16pt; letter-spacing: 2px; }
  .contact { font-size: 8pt; color: #555; margin-top: 2px; }
  .intent { margin: 4px 0 0; font-size: 8.8pt; color: var(--resume-accent); font-weight: 600; }
  h2 { font-size: 9.8pt; color: var(--resume-accent); margin: 6px 0 3px; border-left: 3px solid var(--resume-accent);
       padding-left: 5px; }
  .item { margin-bottom: 4px; }
  .item-head { display: flex; justify-content: space-between; align-items: baseline; font-weight: 600; }
  .meta { font-size: 8pt; color: #555; margin-top: 1px; }
  .role { font-size: 8pt; color: #555; font-style: italic; }
  ul { margin: 2px 0 0 14px; }
  li { margin-bottom: 1px; text-align: justify; }
  .skills div { margin-bottom: 1px; }
  .label { font-weight: 700; }
  .awards { font-size: 8.8pt; line-height: 1.38; }
  .profile { font-size: 8.6pt; line-height: 1.32; text-align: justify; }
</style>
</head>
<body>

<div class="header">
  <h1>{{basics.name}}</h1>
  <div class="contact">{{basics.phone}}{{contact_sep}}{{basics.email}}{{contact_sep2}}{{basics.location}}</div>
  {{intent_block}}
</div>

{{profile_block}}

{{education_block}}

{{projects_block}}

{{work_block}}

{{skills_block}}

{{extras_block}}

</body>
</html>
