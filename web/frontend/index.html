<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- JS 启动后 document.title 会按当前语言覆盖（i18n.init 的 languageChanged）；
         这里的静态值只是 JS 生效前的首帧，用品牌英文名 -->
    <title>Job Workbench</title>
    <!-- 防闪白（批 4）：首帧之前按偏好写好主题属性——等 JS 渲染再切会闪一次默认色。
         "dark" 是 :root 默认，不写属性；"system" 在此解析亮 / 暗。键名与 lib/theme.ts 一致。 -->
    <script>
      (function () {
        try {
          var choice = localStorage.getItem("jobws.theme") || "system";
          if (choice === "system") {
            choice = window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
          }
          if (choice && choice !== "dark") {
            document.documentElement.setAttribute("data-theme", choice);
          }
          // 字体与等宽：写出 data 属性即可，栈本体由 index.css 的变量承接；
          // 旧值 "default" 迁移为 "inter"（2026-09-17 字体方案扩充到 12 款）
          var fontChoice = localStorage.getItem("jobws.font") || "inter";
          if (fontChoice === "default") fontChoice = "inter";
          document.documentElement.setAttribute("data-font", fontChoice);
          var monoChoice = localStorage.getItem("jobws.mono");
          if (monoChoice) {
            document.documentElement.setAttribute("data-mono", monoChoice);
          }
          // 数字槽（批 4.6）：同等宽——没存过就命中 :root 默认款
          var numericChoice = localStorage.getItem("jobws.numeric");
          if (numericChoice) {
            document.documentElement.setAttribute("data-numeric", numericChoice);
          }
          // 字号：连续百分比（80–150，2026-09-17 起）；兼容历史四档值
          var fontSize = localStorage.getItem("jobws.fontsize");
          var legacySizes = { sm: 87.5, base: 100, lg: 112.5, xl: 125 };
          if (fontSize && Object.prototype.hasOwnProperty.call(legacySizes, fontSize)) {
            fontSize = String(legacySizes[fontSize]);
          }
          var pct = parseFloat(fontSize);
          if (pct && pct !== 100) {
            document.documentElement.style.fontSize = pct + "%";
          }
        } catch (e) {
          /* 隐私模式等场景读不到 localStorage：保持默认暗 */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- 首帧启动屏（2026-09-23 白屏审计）：样式全在 JS 包里，而 #root 原本是空的——
           从 HTML 首字节到 React 挂载之间（prod 是 ~424KB bundle 的下载与解析；dev 是
           Vite 模块瀑布）页面只有浏览器默认的纯白。这个启动屏只用内联样式、随 HTML
           首字节立即绘制；createRoot().render() 挂载时会整体替换 #root 的子节点。
           背景色只内置默认暗与亮两套（其余主题的变量在包里，挂载后即接管）。
           品牌名用英文与上方 <title> 同一条理由。 -->
      <div
        id="boot-splash"
        style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: hsl(222 47% 5%); color: hsl(210 40% 96%); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans SC', sans-serif;"
      >
        <style>
          html[data-theme="light"] #boot-splash {
            background: hsl(220 23% 97%);
            color: hsl(222 47% 11%);
          }
          #boot-splash .boot-ring {
            width: 28px;
            height: 28px;
            border-radius: 9999px;
            border: 2px solid rgba(148, 163, 184, 0.35);
            border-top-color: rgba(148, 163, 184, 0.9);
            animation: boot-spin 0.9s linear infinite;
          }
          @keyframes boot-spin {
            to {
              transform: rotate(360deg);
            }
          }
          @media (prefers-reduced-motion: reduce) {
            #boot-splash .boot-ring {
              animation: none;
            }
          }
        </style>
        <div class="boot-ring" aria-hidden="true"></div>
        <div style="font-size: 13px; letter-spacing: 0.08em; opacity: 0.75;">Job Workbench</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
